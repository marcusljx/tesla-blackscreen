<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Screen</title>
    <style>
        /* Remove default margins and hide scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            cursor: none; /* Hides mouse cursor on desktop */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Prevent pulling to refresh or bounce effects on mobile Safari/Chrome */
        body {
            position: fixed;
            touch-action: none;
        }

        /* Fullscreen button styling */
        #fullscreenBtn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            backdrop-filter: blur(5px); /* Elegant glassmorphic effect */
            -webkit-backdrop-filter: blur(5px);
            cursor: pointer;
            transition: opacity 0.5s ease;
            opacity: 1;
            z-index: 9999;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Utility class to hide the button smoothly */
        .hidden {
            opacity: 0 !important;
            pointer-events: none; /* Prevents clicking when invisible */
        }
    </style>
</head>
<body>

    <button id="fullscreenBtn">Go Fullscreen</button>

    <script>
        const btn = document.getElementById('fullscreenBtn');
        let hideTimeout;

        // More aggressive Tesla check: matches 'Tesla', 'QtCarBrowser', or Linux ARM/x86 Chromium profiles common to MCU2/MCU3
        const isTesla = /Tesla|QtCarBrowser/i.test(navigator.userAgent) || 
                       (navigator.platform.includes('Linux') && !/Android/i.test(navigator.userAgent));

        function redirectToTeslaTheater() {
            const targetUrl = encodeURIComponent(window.location.href);
            window.location.href = `https://www.youtube.com/redirect?q=${targetUrl}`;
        }

        // Update button text on initial load if detected
        if (isTesla) {
            btn.textContent = "Launch Tesla Fullscreen";
        }

        // Function to temporarily show the button, then hide it after 3 seconds
        function showButtonBriefly() {
            clearTimeout(hideTimeout);
            btn.classList.remove('hidden');

            hideTimeout = setTimeout(() => {
                btn.classList.add('hidden');
            }, 3000);
        }

        // Fullscreen toggle logic with automatic fallback
        btn.addEventListener('click', (e) => {
            e.stopPropagation();

            if (isTesla) {
                redirectToTeslaTheater();
                return;
            }

            // Standard HTML5 Fullscreen API
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch((err) => {
                        console.log(`Fullscreen blocked, falling back to YouTube redirect: ${err.message}`);
                        // If browser refuses standard fullscreen, fall back to redirect
                        redirectToTeslaTheater();
                    });
                    btn.textContent = "Exit Fullscreen";
                } else {
                    redirectToTeslaTheater();
                }
            } else {
                document.exitFullscreen();
                btn.textContent = "Go Fullscreen";
            }

            showButtonBriefly();
        });

        // Trigger visibility behavior on tap/click
        document.body.addEventListener('click', () => {
            showButtonBriefly();
        });

        // Initialize countdown on load
        showButtonBriefly();
    </script>
</body>
</html>
