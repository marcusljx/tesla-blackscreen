<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Screen</title>
    <style>
        /* Remove default margins and hide scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            cursor: none; /* Hides mouse cursor on desktop */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Prevent pulling to refresh or bounce effects on mobile Safari/Chrome */
        body {
            position: fixed;
            touch-action: none;
        }

        /* Fullscreen button styling */
        #fullscreenBtn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            backdrop-filter: blur(5px); /* Elegant glassmorphic effect */
            -webkit-backdrop-filter: blur(5px);
            cursor: pointer;
            transition: opacity 0.5s ease;
            opacity: 1;
            z-index: 9999;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Utility class to hide the button smoothly */
        .hidden {
            opacity: 0 !important;
            pointer-events: none; /* Prevents clicking when invisible */
        }
    </style>
</head>
<body>

    <button id="fullscreenBtn">Go Fullscreen</button>

    <script>
        const btn = document.getElementById('fullscreenBtn');
        let hideTimeout;

        // Function to temporarily show the button, then hide it after 3 seconds
        function showButtonBriefly() {
            // Cancel any pending timer so it doesn't hide prematurely
            clearTimeout(hideTimeout);
            
            // Make button visible
            btn.classList.remove('hidden');

            // Set a new timer to hide the button after 3000ms (3 seconds)
            hideTimeout = setTimeout(() => {
                btn.classList.add('hidden');
            }, 3000);
        }

        // Fullscreen toggle logic
        btn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevents the body tap event from firing at the same time
            
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
                btn.textContent = "Exit Fullscreen";
            } else {
                document.exitFullscreen();
                btn.textContent = "Go Fullscreen";
            }
            
            // Refresh the timer after clicking
            showButtonBriefly();
        });

        // Trigger the visibility behavior anytime the screen is tapped or clicked
        document.body.addEventListener('click', () => {
            showButtonBriefly();
        });

        // Initialize the countdown when the page first loads
        showButtonBriefly();
    </script>
</body>
</html>
